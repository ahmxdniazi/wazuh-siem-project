<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" width="1200" height="340">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020c14;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#041825;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#020c14;stop-opacity:1"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1"/>
    </linearGradient>
    <!-- Shield gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0044aa;stop-opacity:0.9"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#bgGrad)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.04" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="340"/>
    <line x1="160" y1="0" x2="160" y2="340"/>
    <line x1="240" y1="0" x2="240" y2="340"/>
    <line x1="320" y1="0" x2="320" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="560" y1="0" x2="560" y2="340"/>
    <line x1="640" y1="0" x2="640" y2="340"/>
    <line x1="720" y1="0" x2="720" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="880" y1="0" x2="880" y2="340"/>
    <line x1="960" y1="0" x2="960" y2="340"/>
    <line x1="1040" y1="0" x2="1040" y2="340"/>
    <line x1="1120" y1="0" x2="1120" y2="340"/>
  </g>

  <!-- Circuit-like decorative lines right side -->
  <g opacity="0.15" stroke="#00d4ff" stroke-width="1.5" fill="none">
    <polyline points="900,20 920,20 920,60 960,60"/>
    <polyline points="1000,30 1020,30 1020,80 1060,80 1060,60"/>
    <polyline points="1100,50 1130,50 1130,100"/>
    <polyline points="850,100 870,100 870,140 920,140"/>
    <polyline points="950,120 980,120 980,160 1020,160"/>
    <circle cx="920" cy="60" r="3" fill="#00d4ff"/>
    <circle cx="1060" cy="60" r="3" fill="#00d4ff"/>
    <circle cx="870" cy="140" r="3" fill="#00d4ff"/>
    <circle cx="980" cy="160" r="3" fill="#00d4ff"/>
    <!-- right side bottom -->
    <polyline points="900,280 930,280 930,250 970,250"/>
    <polyline points="1050,300 1080,300 1080,260 1120,260"/>
    <circle cx="970" cy="250" r="3" fill="#00d4ff"/>
    <circle cx="1120" cy="260" r="3" fill="#00d4ff"/>
  </g>

  <!-- Circuit-like decorative lines left side -->
  <g opacity="0.1" stroke="#00d4ff" stroke-width="1.5" fill="none">
    <polyline points="50,60 70,60 70,100 100,100"/>
    <polyline points="30,140 60,140 60,180"/>
    <polyline points="80,200 110,200 110,230 140,230"/>
    <circle cx="100" cy="100" r="3" fill="#00d4ff"/>
    <circle cx="140" cy="230" r="3" fill="#00d4ff"/>
  </g>

  <!-- Radial glow behind shield -->
  <circle cx="200" cy="170" r="130" fill="#00d4ff" opacity="0.03"/>
  <circle cx="200" cy="170" r="90" fill="#00d4ff" opacity="0.04"/>

  <!-- Shield icon (left side) -->
  <g transform="translate(130, 80)" filter="url(#softGlow)">
    <!-- Shield shape -->
    <path d="M70,0 L140,25 L140,95 Q140,155 70,180 Q0,155 0,95 L0,25 Z"
          fill="url(#shieldGrad)" opacity="0.15" stroke="#00d4ff" stroke-width="2"/>
    <!-- Inner shield details -->
    <path d="M70,15 L125,35 L125,95 Q125,145 70,165 Q15,145 15,95 L15,35 Z"
          fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4"/>
    <!-- Lock icon in shield -->
    <rect x="52" y="82" width="36" height="28" rx="4" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.9"/>
    <path d="M58,82 L58,72 Q58,57 70,57 Q82,57 82,72 L82,82" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.9"/>
    <circle cx="70" cy="96" r="5" fill="#00d4ff" opacity="0.9"/>
    <!-- Checkmark / scan lines -->
    <line x1="30" y1="130" x2="110" y2="130" stroke="#00d4ff" stroke-width="1" opacity="0.3" stroke-dasharray="4,4"/>
    <line x1="35" y1="143" x2="105" y2="143" stroke="#00d4ff" stroke-width="1" opacity="0.2" stroke-dasharray="4,4"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>

  <!-- Main Title -->
  <text x="340" y="118" font-family="'Courier New', Courier, monospace" font-size="11" fill="#00d4ff" opacity="0.7" letter-spacing="6">SECURITY INFORMATION &amp; EVENT MANAGEMENT</text>

  <!-- Big Title -->
  <text x="335" y="183" font-family="'Courier New', Courier, monospace" font-size="58" font-weight="900" fill="white" letter-spacing="-1" filter="url(#glow)">WAZUH SIEM</text>

  <!-- Subtitle -->
  <text x="338" y="220" font-family="'Courier New', Courier, monospace" font-size="20" fill="#00d4ff" letter-spacing="3" opacity="0.9">DEPLOYMENT &amp; ANALYSIS</text>

  <!-- Divider line -->
  <rect x="338" y="235" width="500" height="2" fill="url(#accentGrad)" opacity="0.8"/>

  <!-- Tags row -->
  <!-- Tag 1: Wazuh -->
  <rect x="338" y="252" width="100" height="28" rx="4" fill="#00d4ff" opacity="0.12" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <text x="388" y="271" font-family="'Courier New', monospace" font-size="11" fill="#00d4ff" text-anchor="middle" letter-spacing="1">WAZUH v4.14</text>

  <!-- Tag 2: MITRE -->
  <rect x="450" y="252" width="130" height="28" rx="4" fill="#ff6b35" opacity="0.12" stroke="#ff6b35" stroke-width="1" opacity="0.5"/>
  <text x="515" y="271" font-family="'Courier New', monospace" font-size="11" fill="#ff6b35" text-anchor="middle" letter-spacing="1">MITRE ATT&amp;CK</text>

  <!-- Tag 3: Ubuntu/Windows -->
  <rect x="592" y="252" width="140" height="28" rx="4" fill="#4ade80" opacity="0.12" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
  <text x="662" y="271" font-family="'Courier New', monospace" font-size="11" fill="#4ade80" text-anchor="middle" letter-spacing="1">LINUX + WINDOWS</text>

  <!-- Tag 4: Open Source -->
  <rect x="744" y="252" width="110" height="28" rx="4" fill="#a78bfa" opacity="0.12" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
  <text x="799" y="271" font-family="'Courier New', monospace" font-size="11" fill="#a78bfa" text-anchor="middle" letter-spacing="1">OPEN SOURCE</text>

  <!-- Stats row -->
  <text x="338" y="316" font-family="'Courier New', monospace" font-size="12" fill="white" opacity="0.5" letter-spacing="3">
    AGENTS: 3   |   EVENTS: 280+   |   TECHNIQUES: T1003.008   |   TACTICS: 5
  </text>

  <!-- Bottom accent line -->
  <rect x="0" y="337" width="1200" height="3" fill="url(#accentGrad)" opacity="0.5"/>

  <!-- Animated pulse circles (decorative) -->
  <circle cx="1150" cy="40" r="20" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>
  <circle cx="1150" cy="40" r="12" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.3"/>
  <circle cx="1150" cy="40" r="5" fill="#00d4ff" opacity="0.6"/>

  <circle cx="50" cy="300" r="15" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.15"/>
  <circle cx="50" cy="300" r="8" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.2"/>
  <circle cx="50" cy="300" r="3" fill="#00d4ff" opacity="0.4"/>

  <!-- Author info bottom right -->
  <text x="1180" y="320" font-family="'Courier New', monospace" font-size="10" fill="white" opacity="0.35" text-anchor="end" letter-spacing="2">Muhammad Ahmad  •  MS Cybersecurity  •  NUCES</text>
</svg>
